  <body>
    <div id="root">
      <p id="startup-status" class="startup" role="status">
        Calibrating stations…
      </p>
    </div>
    <script>
      (() => {
        const report = (message) => {
          const status = document.getElementById("startup-status");
          if (status) {
            status.textContent = `Threat Pulse could not start: ${message}`;
            status.dataset.state = "error";
          }
        };
        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            if (target && target.tagName === "SCRIPT") {
              report(`a script failed to load (${target.src})`);
            } else if (event.message) {
              report(event.message);
            }
          },
          true
        );
        window.addEventListener("unhandledrejection", (event) => {
          report(String(event.reason?.message ?? event.reason));
        });
      })();
    </script>
    <script type="module" src="./app/main.js"></script>
    <link
      rel="stylesheet"
